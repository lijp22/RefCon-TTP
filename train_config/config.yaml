### model
model_name_or_path: Qwen3-14B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0
lora_target: all
quantization_bit: 8
quantization_method: bnb
double_quantization: true

### dataset
dataset_dir: data
dataset: attack
template: qwen3
cutoff_len: 2800
max_samples: 100000
preprocessing_num_workers: 16

### output
output_dir: saves/Qwen3-14B-Instruct/lora/train
logging_steps: 5
save_steps: 100
plot_loss: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 10
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 0
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
include_num_input_tokens_seen: true
optim: adamw_torch
flash_attn: auto
packing: false
enable_thinking: false